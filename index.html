
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0c10">
<title>Applications</title>

<style>
:root {
  --bg: #0b0c10;
  --panel: #15171d;
  --yellow: #ffcd38;
  --text: #f5f5f7;
  --muted: #969aa6;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Arial, sans-serif;
}

header {
  padding: 32px 5% 20px;
  max-width: 1250px;
  margin: auto;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

h1 {
  margin: 0;
  font-size: 28px;
  letter-spacing: -1px;
}

h1 span {
  color: var(--yellow);
}

.subtitle {
  color: var(--muted);
  font-size: 13px;
  margin: 8px 0 0;
}

.search {
  width: 100%;
  max-width: 340px;
  padding: 13px 17px;
  border: 1px solid #30323b;
  border-radius: 13px;
  background: #1b1d24;
  color: white;
  font-size: 14px;
  outline: none;
}

.search:focus {
  border-color: var(--yellow);
}

.tabs {
  display: flex;
  gap: 8px;
  margin-top: 28px;
}

.tab {
  background: #1a1c22;
  color: #aeb1bd;
  border: 1px solid #30323b;
  border-radius: 10px;
  padding: 10px 18px;
  cursor: pointer;
  font-size: 13px;
}

.tab.active {
  background: var(--yellow);
  color: #111;
  border-color: var(--yellow);
  font-weight: 700;
}

main {
  max-width: 1250px;
  margin: auto;
  padding: 15px 5% 55px;
}

.section-title {
  font-size: 13px;
  color: var(--muted);
  margin: 16px 0 25px;
}

.apps-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 25px 15px;
}

.app {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 11px;
  padding: 12px 5px;
  border-radius: 15px;
  text-decoration: none;
  color: var(--text);
  transition: background .15s, transform .15s;
}

.app:hover,
.app:focus-visible {
  background: #ffffff0b;
  transform: translateY(-3px);
  outline: none;
}

.app-icon {
  width: 68px;
  height: 68px;
  border-radius: 18px;
  display: grid;
  place-items: center;
  font-size: 29px;
  font-weight: 750;
  color: white;
  background: var(--icon-bg, #30394b);
  box-shadow: 0 5px 16px #0003;
}

.app-name {
  font-size: 12px;
  font-weight: 500;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.empty {
  display: none;
  text-align: center;
  color: var(--muted);
  padding: 65px 10px;
}

footer {
  text-align: center;
  padding: 20px;
  font-size: 11px;
  color: #777b88;
}

@media (max-width: 600px) {
  header {
    padding-top: 25px;
  }

  .top {
    flex-direction: column;
    align-items: stretch;
  }

  h1 {
    font-size: 25px;
  }

  .search {
    max-width: none;
  }

  .apps-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 18px 5px;
  }

  .app-icon {
    width: 57px;
    height: 57px;
    border-radius: 15px;
    font-size: 25px;
  }

  .app-name {
    font-size: 11px;
  }
}

@media (max-width: 350px) {
  .apps-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (prefers-reduced-motion: reduce) {
  .app {
    transition: none;
  }
}
</style>
</head>

<body>

<header>
  <div class="top">
    <div>
      <h1>Thunder<span>Os</span></h1>
      <p class="subtitle">Bibliothèque d'applications</p>
    </div>

    <input
      class="search"
      id="search"
      type="search"
      placeholder="Rechercher une application..."
      aria-label="Rechercher une application"
    >
  </div>

  <nav class="tabs" aria-label="Catégories">
    <button class="tab active" data-filter="all">
      Tout
    </button>
    <button class="tab" data-filter="app">
      Applications
    </button>
    <button class="tab" data-filter="game">
      Jeux
    </button>
  </nav>
</header>

<main>
  <div class="section-title" id="count"></div>
  <div class="apps-grid" id="apps"></div>
  <div class="empty" id="empty">
    Aucune application trouvée.
  </div>
</main>

<footer>© ThunderOS</footer>

const grid = document.getElementById("apps");
const search = document.getElementById("search");
const count = document.getElementById("count");
const empty = document.getElementById("empty");
const tabs = document.querySelectorAll(".tab");

let filter = "all";

const colors = [
  "#3a59a5",
  "#8053ad",
  "#b45b46",
  "#247d79",
  "#a47a2a",
  "#525baf",
  "#9a476c",
  "#427348"
];

function normalize(text) {
  return text
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase();
}

function renderApps() {
  const keyword = normalize(search.value.trim());

  const filtered = apps.filter(app => {
    const matchesSearch =
      normalize(app.name).includes(keyword);

    const matchesType =
      filter === "all" || app.type === filter;

    return matchesSearch && matchesType;
  });

  grid.replaceChildren();

  filtered.forEach(app => {
    const originalIndex = apps.indexOf(app);

    const link = document.createElement("a");
    link.className = "app";
    link.href = app.url;
    link.title = "Ouvrir " + app.name;

    const icon = document.createElement("div");
    icon.className = "app-icon";
    icon.textContent = app.name.charAt(0).toUpperCase();

    icon.style.setProperty(
      "--icon-bg",
      colors[originalIndex % colors.length]
    );

    const name = document.createElement("span");
    name.className = "app-name";
    name.textContent = app.name;

    link.append(icon, name);
    grid.appendChild(link);
  });

  count.textContent =
    filtered.length + " application(s)";

  empty.style.display =
    filtered.length === 0 ? "block" : "none";
}

search.addEventListener("input", renderApps);

tabs.forEach(tab => {
  tab.addEventListener("click", () => {
    tabs.forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    filter = tab.dataset.filter;
    renderApps();
  });
});

renderApps();
</script>
